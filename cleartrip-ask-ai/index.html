<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#2f2f31"><title>Cleartrip Ask AI · Prototype</title><link rel="stylesheet" href="style.css?v=f179d47"><script src="app.js?v=9f679c3" defer></script></head>
<body><div class="phone"><div class="shell">
<div class="status-bar" aria-hidden="true">
  <span class="status-time">9:41</span>
  <span class="dynamic-island"></span>
  <span class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="wifi"></span><span class="battery"></span></span>
</div>
<header><button id="back" aria-label="Go back">←</button><div class="spark" aria-hidden="true"><img src="assets/imgAiSparkles.svg" alt=""></div><div><strong id="brand">Cleartrip AI</strong><small id="subtitle">Suggests a plan. You decide.</small></div><button id="reset" aria-label="Start again"></button></header>
<div class="workspace"><main id="screen" tabindex="-1"></main></div><nav id="home-nav" aria-label="Cleartrip"></nav><div id="screen-actions"></div>
<footer id="footer"><form id="composer"><button type="button" id="reel" aria-label="Try a reel link">+</button><input id="message" aria-label="Message Cleartrip AI" placeholder="Ask anything, or paste a reel link" required><button type="button" id="voice" aria-label="Voice input"><img src="assets/imgIconMic.svg" alt=""></button><button type="submit" aria-label="Send message"><img src="assets/imgIconUp.svg" alt=""></button></form><small>Nothing is booked until you review and pay.</small></footer><div class="home-area" aria-hidden="true"><span></span></div><dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div><div id="scenarios" hidden></div><form method="dialog"><button class="primary">Close</button></form></dialog></div></div>
<aside id="edge-picker" aria-labelledby="edge-heading" hidden>
  <h2 id="edge-heading">Edge cases</h2>
  <div id="edge-options"></div>
</aside>
</body></html>
