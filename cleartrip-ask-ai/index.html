<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Cleartrip Ask AI · Prototype</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body><div class="shell"><header><button id="back" aria-label="Go back">←</button><div class="spark" aria-hidden="true">✧</div><div><strong id="brand">Cleartrip AI</strong><small id="subtitle">Suggests a plan. You decide.</small></div><button id="reset" aria-label="Start again">↗</button></header>
<div class="workspace"><aside aria-label="Prototype scenarios"><h2>Your weekend</h2><div id="summary"></div><details><summary>Try a scenario</summary><div id="scenarios"></div></details></aside><main id="screen" tabindex="-1"></main></div>
<footer id="footer"><form id="composer"><button type="button" id="reel" aria-label="Try a reel link">+</button><input id="message" aria-label="Message Cleartrip AI" placeholder="Ask anything, or paste a reel link" required><button type="submit" aria-label="Send message">↑</button></form><small>Interactive demo · No real payments or bookings</small></footer></div><dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-body"></div><form method="dialog"><button class="primary">Close</button></form></dialog></body></html>
